name: CI

# Exercises the cross-platform claim this project makes in SPEC.md (macOS
# AND Windows are both first-class) on every push/PR, since the only
# machine actually building this day to day is Linux-only and can't test
# either target platform directly. Also runs the privacy guard
# (scripts/check-privacy.js) against the full tracked tree as the "CI
# check" half of SPEC.md section 3's belt-and-braces guard — the other
# half is the local pre-commit hook (.githooks/pre-commit), which this
# catches if it was ever skipped or never installed. scripts/__tests__/
# covers the guard and the hook/installer end to end against disposable
# fixture repos, on every OS in the matrix, so a change that quietly
# breaks either doesn't have to be caught by the full-tree run finding
# real leaked data after the fact.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-privacy.js's --staged-less (full-tree) mode shells out to
          # `git show :<path>` for the *index*, which is populated from a
          # normal checkout — a shallow clone is fine for that. Depth 0
          # isn't needed here, unlike a job that diffs against a base ref.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --test-reporter=spec is for the human reading the log; the second
      # reporter (scripts/ci/githubTestReporter.mjs) turns each failing
      # test into a GitHub Actions `::error::` annotation, which is the
      # only part of a check run visible without the job-log auth this
      # build doesn't have — see athena-build/brief.md priority item 0.
      - name: Run privacy-guard and git-hook tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "scripts/__tests__/*.test.js"

      # A separate step/glob because scripts/__tests__/*.test.js doesn't
      # reach this nested directory - these tests were silently never run
      # in real CI (only ever invoked manually) until this step was added.
      - name: Run CI annotation reporter tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "scripts/ci/__tests__/*.test.js"

      - name: Run installer (bootstrap.mjs) tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "installers/__tests__/bootstrap.test.js"

      - name: Run auto-update rollback (rollback.mjs) tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "installers/__tests__/rollback.test.js"

      # installers/macos.sh is bash and only meaningful on an OS that
      # actually runs it; the Windows runner's default shell has no `bash`
      # guaranteed on PATH for the test harness to shell out to.
      - name: Run macOS installer (macos.sh) tests
        if: runner.os != 'Windows'
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "installers/__tests__/macos-sh.test.js"

      # installers/windows.ps1 only matters on the OS that actually runs
      # it; conversely, ubuntu-latest/macos-latest don't ship `pwsh` or
      # `powershell.exe` by default, so the test file itself skips there
      # (see windows-ps1.test.js's findPwshPath) even without this gate —
      # the `if` just avoids paying for a step that would only report
      # skips on two of the three runners.
      - name: Run Windows installer (windows.ps1) tests
        if: runner.os == 'Windows'
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout "installers/__tests__/windows-ps1.test.js"

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Run server tests
        run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/ci/githubTestReporter.mjs --test-reporter-destination=stdout
        working-directory: server

      # --legacy-peer-deps: see installers/bootstrap.mjs's installAndStart
      # comment — a plain `npm install` here reproducibly crashes npm's own
      # ideal-tree builder on vitest's optional browser-mode peer deps.
      - name: Install web dependencies
        if: hashFiles('web/package.json') != ''
        run: npm install --legacy-peer-deps
        working-directory: web

      # github-actions reporter is vitest's own built-in equivalent of the
      # custom node:test reporter above (same motivation: a public
      # annotation GitHub shows without job-log auth).
      - name: Run web tests
        if: hashFiles('web/package.json') != ''
        run: npm test -- --reporter=default --reporter=github-actions
        working-directory: web

      - name: Build web frontend
        if: hashFiles('web/package.json') != ''
        run: npm run build
        working-directory: web

      - name: Privacy guard (full tree)
        run: node scripts/check-privacy.js
