name: Release

# Publishes a GitHub Release for every version tag that
# scripts/promote-release.mjs pushes (atomically with the `release` branch
# move it ships). Two ways in: promote.yml calls it directly after an
# automatic promotion (a tag pushed with a workflow's GITHUB_TOKEN never
# triggers `push: tags`), and the tag push itself triggers it when the
# script is run by hand. The Release notes are the tag's own annotation — the
# commit subjects since the previous version, written by the promote
# script — so this workflow makes no decisions of its own: CI-green,
# fast-forward-only and the version number were all settled before the
# tag existed. Creating a Release needs write auth, which is why this half
# lives here (the workflow's own GITHUB_TOKEN) rather than in the
# deliberately token-free promote script.

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to publish, e.g. v0.4.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Reads the annotation through the API rather than a checkout:
      # actions/checkout's shallow tag fetch can replace an annotated tag
      # with a lightweight one, silently losing exactly the message needed.
      - name: Create GitHub Release from the tag's notes
        env:
          GH_TOKEN: ${{ github.token }}
          # When called, github.ref_name is the caller's ref, not the tag.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag with no notes — tag releases with scripts/promote-release.mjs."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Athena $TAG" --notes-file notes.md
